<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Contato</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container">
    <a href="index.html" class="logo">Nívea Maria</a>
    <nav aria-label="Principal">
      <a href="index.html">Início</a>
      <a href="trabalhos.html">Trabalhos</a>
      <a href="habilidades.html">Habilidades</a>
      <a href="educacao.html">Educação</a>
      <a href="contato.html" aria-current="page">Contato</a>
    </nav>
  </div>
</header>
<main>
  <section class="pagina">
    <div class="container contato-grid">
      <div>
        <h1>Fale comigo</h1>
        <p class="sub">Olá! Se você gostou do meu trabalho ou quer conversar sobre novas oportunidades, sinta-se à vontade para entrar em contato comigo por aqui!</p>
      </div>
      <form action="https://formspree.io/f/xnnorjzo" method="POST" id="formulario-contato">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" required>
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" class="campo-texto" required></textarea>
        <button type="submit" class="enviar">Enviar</button>
      </form>
    </div>
  </section>
</main>
<footer><div class="container">Nívea Maria</div></footer>
</body>
</html>
