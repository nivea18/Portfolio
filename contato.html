<!DOCTYPE html>
<html lang="en">
<head>
<title>Contact</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container">
    <a href="index.html" class="logo">Nívea Maria</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="trabalhos.html">Projects</a>
      <a href="habilidades.html">Skills</a>
      <a href="educacao.html">Education</a>
      <a href="contato.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>
<main>
  <section class="pagina">
    <div class="container contato-grid">
      <div>
        <h1>Get in touch</h1>
        <p class="sub">Hello! If you like my work or would like to talk about new opportunities, feel free to get in touch.</p>
      </div>
      <form action="https://formspree.io/f/xnnorjzo" method="POST" id="formulario-contato">
        <label for="nome">Name:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="assunto">Subject:</label>
        <input type="text" id="assunto" name="assunto" required>
        <label for="mensagem">Message:</label>
        <textarea id="mensagem" name="mensagem" rows="5" class="campo-texto" required></textarea>
        <button type="submit" class="enviar">Send message</button>
      </form>
    </div>
  </section>
</main>
<footer><div class="container">Nívea Maria</div></footer>
</body>
</html>
